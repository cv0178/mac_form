name: Build macOS

# 手动触发，或打 v* 标签时自动触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    # macos-14 = Apple Silicon(arm64)。
    # 不要用 macos-13：它是 Intel，装不上 paddlepaddle==3.2.2（该版本没有 macOS x86_64 wheel）。
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # paddlepaddle==3.2.2 只提供 Python 3.9~3.13 的 wheel。
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fill_form/package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('fill_inForm/requirements.txt') }}
          restore-keys: pip-macos-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fill_inForm/requirements.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller)
        working-directory: fill_inForm/code
        run: bash build_backend.sh

      - name: Verify backend binary
        run: test -x fill_inForm/code/dist/fill_form_backend/fill_form_backend

      - name: Smoke-test backend
        run: |
          cd fill_inForm/code/dist/fill_form_backend
          export FILL_FORM_DATA_DIR="$(mktemp -d)"
          ./fill_form_backend &
          backend_pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8999/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          kill "$backend_pid" 2>/dev/null || true
          if [ "$ready" != "1" ]; then
            echo "::error::后端 /health 无响应，冒烟测试失败"
            exit 1
          fi
          echo "后端冒烟测试通过"

      - name: Copy backend into Electron resources
        run: |
          rm -rf fill_form/resources/backend
          mkdir -p fill_form/resources/backend
          cp -R fill_inForm/code/dist/fill_form_backend/. fill_form/resources/backend/
          ls -la fill_form/resources/backend

      - name: Install desktop dependencies
        working-directory: fill_form
        run: npm ci

      - name: Package & make macOS app (arm64)
        working-directory: fill_form
        run: npx electron-forge make --platform=darwin --arch=arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhitian-macos-arm64
          path: fill_form/out/make/**
          if-no-files-found: error
